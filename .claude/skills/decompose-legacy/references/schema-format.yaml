# Format reference for output/specs/schema.yaml
# Entity schema + relationships. Drives the Model and Repository.
entity:
  name: Product
  table: products
  primary_key: id
  columns:
    - name: id
      type: integer
      primary_key: true
      auto_increment: true
      nullable: false
    - name: name
      type: string
      nullable: false
    - name: description
      type: text
      nullable: true
    - name: price
      type: decimal
      precision: 10
      scale: 2
      nullable: false
    - name: stock
      type: integer
      nullable: false
    - name: category_id
      type: integer
      nullable: true
    - name: created_at
      type: datetime
      nullable: false
  relationships:
    - name: category
      type: belongs_to
      target: Category
      foreign_key: category_id
